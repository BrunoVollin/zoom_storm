version: '3.8'

services:
  zoom-postgres:
    image: postgres:17
    container_name: zoom-postgres
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: zoom
    ports:
      - "3010:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zoom-network

  zoom-mongo:
    image: mongo:latest
    container_name: zoom-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "3020:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - zoom-network

  zoom-redis:
    image: redis:7
    container_name: zoom-redis
    ports:
      - "3030:6379"
    volumes:
      - redis_data:/data
    networks:
      - zoom-network

  zoom-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: zoom-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "3040:8080"
    networks:
      - zoom-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: zoom-kafka
    ports:
      - "3045:9022"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9022
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:3045
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - zoom-network

  akhq:
    image: tchiotludo/akhq:latest
    container_name: zoom-akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:29092"
    ports:
      - "3050:8080"
    depends_on:
      - kafka
    networks:
      - zoom-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: zoom-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - zoom-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: zoom-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - zoom-network

  loki:
    image: grafana/loki:3.3.2
    container_name: zoom-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3060:3100"
    networks:
      - zoom-network

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: zoom-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - zoom-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: zoom-grafana
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3080:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - zoom-network

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  zoom-network:
    driver: bridge
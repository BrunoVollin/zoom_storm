name: zoom-storm-e2e

services:
  postgres-e2e:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-root
      POSTGRES_DB: zoom_storm_e2e_control
    ports:
      - "${E2E_POSTGRES_PORT:-13010}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoom_storm_e2e_control"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    networks:
      - zoom_e2e_network

  mongo-e2e:
    image: mongo:8.2.12
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: e2e-root
    ports:
      - "${E2E_MONGO_PORT:-13020}:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username root --password e2e-root --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mongo_e2e_data:/data/db
    networks:
      - zoom_e2e_network

  redis-e2e:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${E2E_REDIS_PORT:-13030}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis_e2e_data:/data
    networks:
      - zoom_e2e_network

  keycloak-e2e:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-e2e
    ports:
      - "${E2E_KEYCLOAK_PORT:-13040}:8080"
      - "${E2E_KEYCLOAK_HEALTH_PORT:-13041}:9000"
    volumes:
      - ./scripts/e2e/keycloak/zoom-storm-e2e-realm.json:/opt/keycloak/data/import/zoom-storm-e2e-realm.json:ro
      - keycloak_e2e_data:/opt/keycloak/data
    networks:
      - zoom_e2e_network

  kafka-e2e:
    image: confluentinc/cp-kafka:8.3.0
    ports:
      - "${E2E_KAFKA_PORT:-13045}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-e2e:29092,PLAINTEXT_HOST://localhost:${E2E_KAFKA_PORT:-13045}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-e2e:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - kafka_e2e_data:/var/lib/kafka/data
    networks:
      - zoom_e2e_network

volumes:
  postgres_e2e_data:
  mongo_e2e_data:
  redis_e2e_data:
  keycloak_e2e_data:
  kafka_e2e_data:

networks:
  zoom_e2e_network:
    driver: bridge
